<script>
(function () {
  var APPS = [
    { key: 'pc', name: '承包商考核评价', desc: '准入、项目、考核评价等', color: '#2e62b1',
      href: '../dist/承包商考核评价.html',
      icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>' },
    { key: 'iim', name: '综合信息管理', desc: '组织机构、人员管理、安全承诺', color: '#0f9f8f',
      href: null,
      icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>' }
  ];
  var CURRENT = 'iim';
  var mask = null;

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function build() {
    mask = el('div', 'cm-app-mask');
    mask.hidden = true;

    var panel = el('div', 'cm-app-panel');
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-label', '菜单总览');

    var head = el('div', 'cm-app-head');
    head.appendChild(el('div', 'cm-app-title', '菜单总览'));
    var closeBtn = el('button', 'cm-app-close', '&times;');
    closeBtn.type = 'button';
    closeBtn.setAttribute('aria-label', '关闭');
    closeBtn.addEventListener('click', close);
    head.appendChild(closeBtn);
    panel.appendChild(head);

    var grid = el('div', 'cm-app-grid');
    APPS.forEach(function (app) {
      var card;
      if (app.key === CURRENT) {
        card = el('div', 'cm-app-card current');
      } else {
        card = el('button', 'cm-app-card');
        card.type = 'button';
      }

      var ico = el('span', 'cm-app-ico', app.icon);
      ico.style.background = app.color;
      card.appendChild(ico);

      var info = el('span', 'cm-app-info');
      var name = el('span', 'cm-app-name');
      name.appendChild(document.createTextNode(app.name));
      if (app.key === CURRENT) name.appendChild(el('span', 'cm-app-badge', '当前'));
      info.appendChild(name);
      info.appendChild(el('span', 'cm-app-desc', app.desc));
      card.appendChild(info);

      if (app.key !== CURRENT) {
        card.appendChild(el('span', 'cm-app-go', '进入 →'));
        card.addEventListener('click', function () {
          window.location.href = app.href;
        });
      }
      grid.appendChild(card);
    });
    panel.appendChild(grid);
    mask.appendChild(panel);

    mask.addEventListener('click', function (e) {
      if (e.target === mask) close();
    });
    document.body.appendChild(mask);
  }

  function open() {
    if (!mask) build();
    mask.hidden = false;
  }

  function close() {
    if (mask) mask.hidden = true;
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document) {
      if (t.tagName === 'BUTTON' && t.textContent.trim() === '菜单总览') {
        e.preventDefault();
        e.stopPropagation();
        if (mask && !mask.hidden) close(); else open();
        return;
      }
      t = t.parentNode;
    }
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });

  /* 补齐侧边栏中缺失的菜单图标，使菜单项图标保持一致 */
  var SIDE_ICONS = {
    '组织机构': '<rect x="9" y="3" width="6" height="5" rx="1"></rect><rect x="3" y="16" width="6" height="5" rx="1"></rect><rect x="15" y="16" width="6" height="5" rx="1"></rect><path d="M12 8v3M6 16v-3h12v3"></path>',
    '智能排班': '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path><path d="M12 13v3.5l2.5 1.5"></path>',
    '安全承诺': '<path d="M12 3 4.5 6v5.6c0 4.4 3.2 7.5 7.5 9.4 4.3-1.9 7.5-5 7.5-9.4V6L12 3Z"></path><path d="m8.8 12 2.2 2.2 4.2-4.4"></path>'
  };

  function decorateSidebar() {
    var boxes = document.querySelectorAll('aside nav span[class*="w-[32px]"]');
    Array.prototype.forEach.call(boxes, function (box) {
      if (box.querySelector('svg')) return;
      var row = box.parentElement;
      var label = row && row.querySelector('span[class*="max-w-[136px]"]');
      if (!label) return;
      var d = SIDE_ICONS[label.textContent.trim()];
      if (!d) return;
      box.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#444c63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
    });

    var arrows = document.querySelectorAll('aside nav span[class*="top-[13px]"]');
    Array.prototype.forEach.call(arrows, function (a) {
      var row = a.parentElement;
      var label = row && row.querySelector('span[class*="max-w-[136px]"]');
      var isParent = label && label.textContent.trim() === '安全承诺';
      a.style.display = isParent ? '' : 'none';
    });
  }

  var TOP_LABELS = {
    '/org': '组织机构',
    '/major-hazard': '重大危险源',
    '/personnel': '人员管理',
    '/org-tag': '生产机构标签',

    '/leave': '休假管理',
    '/smart-shift': '智能排班',
    '/site-new': '场所设施（新）'
  };

  function markTopActive() {
    var rows = document.querySelectorAll('aside nav > div > div');
    Array.prototype.forEach.call(rows, function (r) { r.classList.remove('sp-menu-active'); });
    var hash = location.hash.replace(/^#/, '').split('?')[0];
    var label = TOP_LABELS[hash];
    if (!label) return;
    Array.prototype.forEach.call(rows, function (r) {
      if (r.className.indexOf('h-[40px]') >= 0 && r.textContent.trim() === label) r.classList.add('sp-menu-active');
    });
  }

  decorateSidebar();
  markTopActive();
  window.addEventListener('hashchange', function () {
    setTimeout(decorateSidebar, 0);
    setTimeout(markTopActive, 0);
  });
  setTimeout(decorateSidebar, 300);
  setTimeout(markTopActive, 300);
  setTimeout(decorateSidebar, 1200);
  setTimeout(markTopActive, 1200);
})();

    } else if (ui.view === 'rem-new') {

    } else if (ui.view === 'rem-edit') {
      var r = findReminder(ui.arg);
      ui.form = r ? { type: 'reminder', id: r.id, name: r.name, level: r.level, depts: r.depts.slice(), targets: r.targets.slice(), rule: r.rule, time: r.time, every: r.every, channels: r.channels.slice() } : null;

  function pageHTML() {
    var v = ui.view;
    if (v === 'flow-new') return flowFormHTML(false);
    if (v === 'flow-edit') return flowFormHTML(findFlow(ui.arg));
    if (v === 'flow-detail') return flowDetailHTML(findFlow(ui.arg));
    if (v === 'rem-new') return reminderFormHTML(false);
    if (v === 'rem-edit') return reminderFormHTML(findReminder(ui.arg));
    if (v === 'rem-detail') return reminderDetailHTML(findReminder(ui.arg));
    if (v === 'auth-list') return authListHTML();

    return configListHTML();
  }

  /* ---------- overlay ---------- */
  var overlay = document.createElement('div');
  overlay.className = 'iimp-page';
  document.body.appendChild(overlay);

  function render() {
    overlay.innerHTML = pageHTML();
    if (ui.modal) renderModal();
  }

  function sync(force) {
    var p = currentPath();
    var main = document.querySelector('main');
    if (!main) return;
    var top = topOf(p);
    if (!top) {
      overlay.style.display = 'none';
      if (ui.top) { ui.top = null; ui.path = null; ui.form = null; closeModal(); }
      return;
    }
    var r = main.getBoundingClientRect();
    overlay.style.display = 'flex';
    overlay.style.left = r.left + 'px';
    overlay.style.top = r.top + 'px';
    overlay.style.width = r.width + 'px';
    overlay.style.height = r.height + 'px';
    if (force || ui.top !== top || ui.path !== p) {
      ui.top = top;
      ui.path = p;
      var v = viewOf(p);
      ui.view = v.view;
      ui.arg = v.arg || null;
      initForm();
      render();
    }
  }

    } else if (act === 'cfg-reset') {
      if (ui.tab === 'flow') ui.cfg.flow = { name: '', dept: '' };
      else ui.cfg.reminder = { name: '', level: '', dept: '', rule: '', channel: '', status: '' };
      render();
    } else if (act === 'new-flow') go('flow-new');
    else if (act === 'new-reminder') go('rem-new');
    else if (act === 'detail-flow') go('flow-detail', v);
    else if (act === 'edit-flow') go('flow-edit', v);
    else if (act === 'detail-reminder') go('rem-detail', v);
    else if (act === 'edit-reminder') go('rem-edit', v);
    else if (act === 'back-config') go('config-list');
    else if (act === 'back-auth') go('auth-list');
    else if (act === 'copy-flow') {
      var f = findFlow(v); if (f) { var c = clone(f); c.id = nextId('f', db.flows); c.name = f.name + '副本'; db.flows.push(c); render(); toast('复制成功'); }
    } else if (act === 'delete-flow') {
      if (window.confirm('确定删除该审批流吗？')) { db.flows = db.flows.filter(function (x) { return x.id !== v; }); render(); toast('删除成功'); }
    } else if (act === 'copy-reminder') {
      var r = findReminder(v); if (r) { var c2 = clone(r); c2.id = nextId('r', db.reminders); c2.name = r.name + '副本'; db.reminders.push(c2); render(); toast('复制成功'); }
    } else if (act === 'toggle-reminder') {
      var r2 = findReminder(v); if (r2) { r2.status = r2.status === '启用' ? '停用' : '启用'; r2.updated = nowText(); render(); toast(r2.status); }
    } else if (act === 'delete-reminder') {
      if (window.confirm('确定删除该消息提醒吗？')) { db.reminders = db.reminders.filter(function (x) { return x.id !== v; }); render(); toast('删除成功'); }
    } else if (act === 'rm-approver') {
      ui.form.approvers = ui.form.approvers.filter(function (x) { return x !== v; });
      render();
    } else if (act === 'pick-approver') {
      ui.apx = { tab: '部门', selected: (ui.form.approvers || []).slice(), query: '', include: false };
      ui.modal = { type: 'approver' }; renderModal();
    } else if (act === 'pick-depts') {
      ui.multi = { title: '选择适用部门', options: DEPTS.concat(['wl测试部门', '质量效能部', '测试部', '生产部', '安迪苏泉州基地']), selected: (ui.form.depts || []).slice(), key: 'depts' };
      ui.modal = { type: 'multi' }; renderModal();
    } else if (act === 'pick-targets') {
      ui.multi = { title: '选择推送对象', options: TARGETS, selected: (ui.form.targets || []).slice(), key: 'targets' };
      ui.modal = { type: 'multi' }; renderModal();
    } else if (act === 'save-flow') {
      var d = ui.form;
      if (!d.name || !d.dept) { toast('请填写审批流名称和适用部门'); return; }
      if (!d.node) { toast('请填写审批节点名称'); return; }
      if (d.id) {
        var old = findFlow(d.id);
        old.name = d.name; old.dept = d.dept; old.node = d.node; old.defaultOpinion = d.opinion;
        old.approvers = d.approvers.slice(); old.updater = 'admin'; old.updated = nowText();
      } else {
        db.flows.push({ id: nextId('f', db.flows), name: d.name, dept: d.dept, node: d.node, defaultOpinion: d.opinion || '同意', approvers: d.approvers.slice(), updater: 'admin', updated: nowText() });
      }
      go('config-list'); toast('保存成功');
    } else if (act === 'save-reminder') {
      var d2 = ui.form;
      if (!d2.name) { toast('请输入消息提醒名称'); return; }
      if (!d2.level) { toast('请选择适用级别'); return; }
      if (!d2.depts.length) { toast('请选择适用部门'); return; }
      if (!d2.targets.length) { toast('请选择推送对象'); return; }
      if (!d2.channels.length) { toast('请选择推送方式'); return; }
      if (d2.id) {
        var old2 = findReminder(d2.id);
        old2.name = d2.name; old2.level = d2.level; old2.depts = d2.depts.slice(); old2.targets = d2.targets.slice();
        old2.rule = d2.rule; old2.time = d2.time; old2.every = d2.every; old2.channels = d2.channels.slice();
        old2.updater = 'admin'; old2.updated = nowText();
      } else {
        db.reminders.push({ id: nextId('r', db.reminders), name: d2.name, level: d2.level, depts: d2.depts.slice(), targets: d2.targets.slice(), rule: d2.rule, time: d2.time, every: d2.every, channels: d2.channels.slice(), status: '启用', updater: 'admin', updated: nowText() });
      }
      go('config-list'); toast('保存成功');
    } else if (act === 'auth-query') {
      var g2 = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
      ui.authFilter = { from: g2('iimp-af-from'), to: g2('iimp-af-to'), t1: g2('iimp-af-t1'), t2: g2('iimp-af-t2'), term1: g2('iimp-af-term1'), term2: g2('iimp-af-term2') };
      render();
    } else if (act === 'auth-reset') {
      ui.authFilter = { from: '', to: '', t1: '', t2: '', term1: '', term2: '' };
      render();
    } else if (act === 'new-auth') {
      ui.authForm = { to: '', scope: true, start: '', end: '', note: '' };
      ui.modal = { type: 'auth' }; renderModal();
    } else if (act === 'detail-auth') go('auth-detail', v);
    else if (act === 'logs-auth') {
      ui.logs = findAuth(v) || { id: v };
      ui.modal = { type: 'logs' }; renderModal();
    }
  });

  overlay.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (!k || !ui.form) return;
    if (k === 'channels') {
      ui.form.channels = Array.prototype.slice.call(overlay.querySelectorAll('[data-k="channels"]:checked')).map(function (x) { return x.value; });
    } else {
      ui.form[k] = e.target.value;
    }
  });

  overlay.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k');
    if (!k || !ui.form) return;
    if (k === 'channels') {
      ui.form.channels = Array.prototype.slice.call(overlay.querySelectorAll('[data-k="channels"]:checked')).map(function (x) { return x.value; });
    } else {
      ui.form[k] = e.target.value;
    }
  });

  /* ---------- modal events ---------- */
  modalRoot.addEventListener('click', function (e) {
    var t = e.target.closest('[data-mact]');
    if (!t) return;
    var act = t.getAttribute('data-mact');
    var v = t.getAttribute('data-v');
    var m = ui.modal;
    if (!m) return;
    if (act === 'close') { closeModal(); }
    else if (act === 'apx-tab') { ui.apx.tab = v; ui.apx.query = ''; renderModal(); }
    else if (act === 'apx-node') {
      var i = ui.apx.selected.indexOf(v);
      if (i >= 0) ui.apx.selected.splice(i, 1); else ui.apx.selected.push(v);
      if (ui.apx.include && DEPT_CHILDREN[v]) {
        DEPT_CHILDREN[v].forEach(function (c) {
          var j = ui.apx.selected.indexOf(c);
          if (i < 0 && j < 0) ui.apx.selected.push(c);
          if (i >= 0 && j >= 0) ui.apx.selected.splice(j, 1);
        });
      }
      renderModal();
    } else if (act === 'apx-rm') {
      ui.apx.selected = ui.apx.selected.filter(function (x) { return x !== v; });
      renderModal();
    } else if (act === 'apx-search') {
      var q = document.getElementById('iimp-apx-q');
      ui.apx.query = q ? q.value : '';
      renderModal();
    } else if (act === 'apx-all') {
      var visible = apxVisible();
      var allSelected = visible.every(function (x) { return ui.apx.selected.indexOf(x) >= 0; });
      if (allSelected) ui.apx.selected = ui.apx.selected.filter(function (x) { return visible.indexOf(x) < 0; });
      else visible.forEach(function (x) { if (ui.apx.selected.indexOf(x) < 0) ui.apx.selected.push(x); });
      renderModal();
    } else if (act === 'apx-include') {
      ui.apx.include = !ui.apx.include;
      renderModal();
    } else if (act === 'apx-clear') { ui.apx.selected = []; renderModal(); }
    else if (act === 'apx-confirm') {
      ui.form.approvers = ui.apx.selected.slice();
      closeModal(); render(); toast('已选择' + ui.apx.selected.length + '位审批人');
    } else if (act === 'person-row') {
      ui.person.selected = v; renderModal();
    } else if (act === 'person-search') {
      var pn = document.getElementById('iimp-p-name'), pno = document.getElementById('iimp-p-no'), pp = document.getElementById('iimp-p-post');
      ui.person.name = pn ? pn.value : ''; ui.person.no = pno ? pno.value : ''; ui.person.post = pp ? pp.value : '';
      renderModal();
    } else if (act === 'person-confirm') {
      if (!ui.person.selected) { toast('请选择人员'); return; }
      ui.authForm.to = ui.person.selected;
      closeModal(); openAuthModal(); toast('已选择' + ui.person.selected);
    } else if (act === 'open-person') {
      ui.person = { name: '', no: '', post: '', selected: ui.authForm.to || '' };
      ui.modal = { type: 'person' }; renderModal();
    } else if (act === 'save-auth') {
      var f = ui.authForm;
      if (!f.to) { toast('请选择被授权人'); return; }
      if (!f.start || !f.end) { toast('请选择授权期限'); return; }
      db.auths.unshift({ id: nextId('a', db.auths), time: nowText(), from: 'admin', to: f.to, start: f.start, end: f.end, scope: f.scope ? '公司级安全风险研判' : '-', status: '生效中', reason: '', stopDate: '', note: f.note || '-' });
      closeModal(); render(); toast('授权成功');
    } else if (act === 'multi-toggle') {
      var arr = ui.multi.selected; var k = arr.indexOf(v);
      if (k >= 0) arr.splice(k, 1); else arr.push(v);
      renderModal();
    } else if (act === 'multi-confirm') {
      ui.form[ui.multi.key] = ui.multi.selected.slice();
      closeModal(); render();
    }
  });

  modalRoot.addEventListener('input', function (e) {
    var act = e.target.getAttribute && e.target.getAttribute('data-mact');
    if (!act || !ui.authForm) return;
    if (act === 'note') {
      ui.authForm.note = e.target.value;
      var c = document.getElementById('iimp-note-count');
      if (c) c.textContent = e.target.value.length + '/200';
    }
  });
  modalRoot.addEventListener('change', function (e) {
    var act = e.target.getAttribute && e.target.getAttribute('data-mact');
    if (!act || !ui.authForm) return;
    if (act === 'scope') ui.authForm.scope = e.target.checked;
    else if (act === 'start') ui.authForm.start = e.target.value;
    else if (act === 'end') ui.authForm.end = e.target.value;
  });
  function openAuthModal() { ui.modal = { type: 'auth' }; renderModal(); }

  /* ---------- legacy page fixes ---------- */
  function replaceText(root, from, to) {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var nodes = []; var n;
    while ((n = w.nextNode())) { if (n.nodeValue && n.nodeValue.indexOf(from) >= 0) nodes.push(n); }
    nodes.forEach(function (x) { x.nodeValue = x.nodeValue.split(from).join(to); });
  }

  function applyLegacyFixes() {
    var p = currentPath();
    var main = document.querySelector('main');
    if (!main) return;
    if (p === '/promise/team' || p === '/promise/company') {
      var cards = main.querySelectorAll('.sp-card');
      for (var j = 0; j < cards.length; j++) {
        var card = cards[j];
        if (!card.querySelector('table.sp-tbl') || card.querySelector('.iimp-list-title')) continue;
        var row = card.firstElementChild;
        if (row && row.tagName === 'DIV') {
          row.classList.add('iimp-title-row');
          var title = document.createElement('span');
          title.className = 'iimp-list-title';
          title.textContent = p === '/promise/team' ? '班组级安全风险研判' : '公司级安全风险研判';
          row.insertBefore(title, row.firstChild);
        }
        break;
      }
    }
    var table = main.querySelector('table.sp-tbl');
    if (table && /^\/promise\/(team|workshop|company|announce)$/.test(p)) {
      var pct = {
        '/promise/team': [4, 15, 13, 12, 25, 11, 20],
        '/promise/workshop': [5, 13, 12, 11, 15, 14, 11, 19],
        '/promise/company': [4, 9, 10, 10, 14, 13, 14, 9, 17],
        '/promise/announce': [6, 20, 16, 24, 16, 18],
      }[p];
      var cols = table.querySelectorAll('col');
      if (pct && cols.length === pct.length) {
        for (var k = 0; k < cols.length; k++) cols[k].style.width = pct[k] + '%';
        table.style.width = '100%';
      }
    }
  }
  var fixTimer = null;
  function fixSoon() { clearTimeout(fixTimer); fixTimer = setTimeout(applyLegacyFixes, 60); }

  /* ---------- observe ---------- */
  var rootEl = document.getElementById('root');
  if (rootEl) {
    new MutationObserver(function () { sync(false); fixSoon(); }).observe(rootEl, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
  }
  window.addEventListener('hashchange', function () { sync(true); fixSoon(); });
  window.addEventListener('resize', function () { sync(false); });
  document.addEventListener('click', function () { setTimeout(function () { sync(false); }, 260); }, true);

  var startTimer = setInterval(function () {
    if (document.querySelector('main')) {
      clearInterval(startTimer);
      sync(true); fixSoon();
    }
  }, 50);
  sync(true); fixSoon();
})();

</script>
<!-- iim-pages:end -->

  <script>
    (function () {
      var h = location.hash.replace(/^#/, '');
      if (!h || h === '/') {
        try { history.replaceState(null, '', '#/promise/team'); }
        catch (e) { location.hash = '/promise/team'; }
      }
    })();
  </script>
  <style>.cm-app-mask{display:none !important;}</style>
  <script>
    (function () {
      function isOverview(el) {
        return el && el.tagName === 'BUTTON' && el.textContent.trim() === '菜单总览';
      }
      window.addEventListener('click', function (e) {
        var el = e.target;
        while (el && el !== document) {
          if (isOverview(el)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return;
          }
          el = el.parentNode;
        }
      }, true);
      function mark() {
        var buttons = document.querySelectorAll('button');
        for (var i = 0; i < buttons.length; i++) {
          var b = buttons[i];
          if (b.textContent.trim() === '菜单总览' && !b.disabled) {
            b.disabled = true;
            b.setAttribute('aria-disabled', 'true');
            b.style.opacity = '.4';
            b.style.cursor = 'not-allowed';
          }
        }
      }
      mark();
      var root = document.getElementById('root');
      if (root) new MutationObserver(mark).observe(root, { childList: true, subtree: true });
      var timer = setInterval(mark, 300);
      setTimeout(function () { clearInterval(timer); }, 6000);
    })();
  </script>
