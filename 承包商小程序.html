ms:[`原则上，我们仅在告知并获取您授权同意的情况下，向关联方传输您的个人信息。`,`除以下情况及本政策另有约定外，我们不会与任何公司、组织和个人共享您的个人信息：事先获得您明确的同意或授权；根据适用的法律法规及法律程序的要求必须提供；为维护公共利益或您的合法权益而有必要提供。`,`在涉及合并、收购、破产清算、资产转让或类似的交易时，如涉及到个人信息转让，我们会要求新的持有您个人信息的公司、组织继续受本政策的约束。`]},{title:`四、您的权利`,items:[`您有权访问您的个人信息，法律法规规定的例外情况除外。您可以在“我的”界面中查看您的个人资料以及相关信息。`,`如需变更个人信息，您可联系企业管理员进行更正；如不再使用我们的产品或服务，可通过本政策第七条方式申请注销账户。`]},{title:`五、本政策如何更新`,items:[`我们可能会不时更新本政策。如本政策发生修订，我们将及时在产品界面显著位置发布最新版本。如本政策有重大变更时，我们会提供更加显著的方式来通知您。`]},{title:`六、如何联系我们`,items:[`如果您对本政策有任何意见、建议或疑问，请联系中化信息技术有限公司客服热线 4008105866，或发送邮件至 itsm@sinochem.com。原则上我们将在30天内给予答复。`]}];function Qa(){return(0,z.jsxs)(`div`,{style:{padding:`4px 2px 20px`},children:[(0,z.jsx)(`div`,{style:{fontSize:12,color:`#8a8f99`,lineHeight:`20px`},children:`更新日期：2022年5月11日`}),(0,z.jsx)(`div`,{style:{fontSize:12,color:`#8a8f99`,lineHeight:`20px`,marginBottom:10},children:`生效日期：2022年6月11日`}),Za.map(e=>(0,z.jsxs)(`div`,{style:{marginBottom:12},children:[(0,z.jsx)(`div`,{style:{fontSize:14,fontWeight:600,color:`#1f2329`,lineHeight:`22px`,marginBottom:4},children:e.title}),e.items.map((e,t)=>(0,z.jsx)(`p`,{style:{fontSize:13,color:`#4a5160`,lineHeight:`21px`,margin:`0 0 6px`},children:e},t))]},e.title))]})}function $a(){return(0,z.jsxs)(z.Fragment,{children:[(0,z.jsx)(H,{title:`隐私政策`,back:!0}),(0,z.jsx)(`div`,{className:`mini-body`,style:{background:`#fff`},children:(0,z.jsx)(Qa,{})})]})}var eo=`data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAS0AAAGNCAYAAABE/ycAAADWbklEQVR4nO39h3YjyZKtDXogoAHq1CWO6Nt3/n/e/01m1sz07T6yqlInJbTyWd82t0AwtaACGHYOCsxMEgzl201s25aNx+NQmdlyFcN8sQqL5SrMFss4ni4Cr9F0Ec6G03B8MQnHF2O9nw1m4XQ4DaeDaRhO5mE0nYfxZBHGs4V+frGMYbFahVqWhTzPQj2vhWa9FrqtRui06qHbqofdbivs9Zphr9cK+/1WONxph8OdTjjYaYdeu67v6zTrodXIQ7ORZ/x8s56HLMtCsP9XVtm9s/ptH8BdMsBmNJ1HQGgwnod355Pw7nysF+B0PpqF89E0XIxmArLRBECbh8lsCciF2Zz3VVitYliuVmEVY8hCFmrLLCxqqzBfZGGxWIXJbBGGk1y/43Rg4NRrN8JOtxV2u82w02kKxHgd9Nthv9/k3yL/lndrWZ6HkMUQYsanV1bZ/bIKtEq2BLQmCwEUgPX7m4vwW3qdXEwMqPCopu5NAUQreWi8Viv7OgIo/C/a58oxyjJ5XdPaMtRqWchr5n3xavCq1+RVdVqN0G
